name: Build and push images

on:
  push:
    branches: [main]
    paths:
      - .forgejo/workflows/build.yml
      - 'images/**'
  pull_request:
    branches: [main]

concurrency:
  group: ${{ forgejo.workflow }}-${{ forgejo.ref }}
  cancel-in-progress: ${{ forgejo.event_name == 'pull_request' }}

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      # "none" keeps the matrix non-empty, so build-and-push always reports a status
      images: ${{ steps.filter.outputs.changes == '[]' && '["none"]' || steps.filter.outputs.changes }}
    steps:
      - uses: https://data.forgejo.org/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - id: filter
        uses: https://github.com/dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          base: ${{ forgejo.event_name == 'push' && forgejo.ref || '' }}
          filters: |
            forgejo-runner-engine:
              - 'images/forgejo-runner-engine/**'
              - '.forgejo/workflows/build.yml'
            forgejo-runner-jobs:
              - 'images/forgejo-runner-jobs/**'
              - '.forgejo/workflows/build.yml'
            vscode-server:
              - 'images/vscode-server/**'
              - '.forgejo/workflows/build.yml'

  build-and-push:
    needs: detect-changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: ${{ fromJson(needs.detect-changes.outputs.images) }}
    steps:
      - uses: https://data.forgejo.org/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: matrix.image != 'none'

      - name: Build
        if: matrix.image != 'none'
        id: build
        uses: https://data.forgejo.org/redhat-actions/buildah-build@719e3c40d8af9790c23eca13f7daa339f2867034 # v3
        with:
          image: ${{ matrix.image }}
          tags: latest
          context: images/${{ matrix.image }}
          containerfiles: images/${{ matrix.image }}/Containerfile
          platforms: linux/amd64,linux/arm64
          layers: true

      - name: Push
        if: matrix.image != 'none' && forgejo.event_name == 'push'
        uses: https://data.forgejo.org/redhat-actions/push-to-registry@94ade333c38ecc0e60e94785125d9a52ca423b37 # v3
        with:
          image: ${{ steps.build.outputs.image }}
          tags: ${{ steps.build.outputs.tags }}
          registry: ${{ vars.REGISTRY }}/${{ forgejo.repository_owner }}
          username: ${{ forgejo.repository_owner }}
          password: ${{ secrets.PACKAGE_TOKEN }}
